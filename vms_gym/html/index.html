<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <head>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        
        <link href="nui://vms_cityhall/html/css/shared.css" rel="stylesheet">

        <link href="css/style.css" rel="stylesheet">
        <link href="css/management.css" rel="stylesheet">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.cdnfonts.com/css/fake-receipt" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    </head>
    <body>
        <div class="receipt">
            <div class="receipt-texts">
                <div class="header-label"></div>
                <br>
                <div class="legend">
                    <div class="item"></div>
                    <div class="amount"></div>
                </div>
                <div>----------------------------------</div>
                <div class="list"></div>
                <div>----------------------------------</div>
                <div class="total">
                    <div></div>
                    <div><span></span></div>
                </div>
                <div>----------------------------------</div>
                <div class="buttons">
                    <div class="pay_cash"></div>
                    <div class="pay_bank"></div>
                    <div class="cancel"></div>
                </div>
            </div>
            <img src="./images/receipt.png" class="receipt-img">
        </div>

        <div class="management-menu">
            <div class="header">
                <p class="store-name"></p>
                <div class="close">
                    <i class="fas fa-close"></i>
                </div>
            </div>
            <div class="menu">
                <div class="select-player">
                    <div>
                        <div class="header">
                            <p class="name"></p>
                            <div class="back-to-menu">
                                <i class="fas fa-close"></i>
                            </div>
                        </div>
                        <div class="menu">

                        </div>
                    </div>
                </div>
                
                <div class="side-bar">
                    <div data-href="main" class="button">
                        <div class="icon-box">
                            <i class="fa-solid fa-home"></i>
                        </div>
                        <div class="name">
                            <p class="title"></p>
                            <p class="description"></p>
                        </div>
                    </div>
                    <div data-href="employees" class="button">
                        <div class="icon-box">
                            <i class="fa-solid fa-users"></i>
                        </div>
                        <div class="name">
                            <p class="title"></p>
                            <p class="description"></p>
                        </div>
                    </div>
                    <div data-href="memberships" class="button">
                        <div class="icon-box">
                            <i class="fa-solid fa-id-card-clip"></i>
                        </div>
                        <div class="name">
                            <p class="title"></p>
                            <p class="description"></p>
                        </div>
                    </div>
                    <div data-href="proteins" class="button">
                        <div class="icon-box">
                            <i class="fa-solid fa-prescription-bottle"></i>
                        </div>
                        <div class="name">
                            <p class="title"></p>
                            <p class="description"></p>
                        </div>
                    </div>
                    <div data-href="boss-management" class="button">
                        <div class="icon-box">
                            <i class="fa-solid fa-users-cog"></i>
                        </div>
                        <div class="name">
                            <p class="title"></p>
                            <p class="description"></p>
                        </div>
                    </div>
                </div>
                <div class="main">
                    <div data-type="main">
                        <div>
                            <div class="side-boxes">
                                <div class="box" data-type="announcements">
                                    <div class="header"></div>
                                    <div class="title"></div>
                                    <div class="announcements-messages" id="announcements-chat">
    
                                    </div>
                                    <i class="fa-solid fa-bullhorn"></i>
                                </div>
                                <div class="box" data-type="total-earned">
                                    <div class="header"></div>
                                    <div class="title"></div>
                                    <i class="fa-solid fa-dollar"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div data-type="employees">
                        <div>
                            <div class="employees-list">
                                <table id="employees-table">
                                    <thead>
                                        <tr>
                                            <th class="table-first" style="padding-block: 0.3em;"><span id="employee"></span></th>
                                            <th><span id="grade"></span></span></th>
                                            <th class="table-last center"><span id="option"></span></th>
                                        </tr>
                                    </thead>
                                    <tbody>
    
                                    </tbody>
                                </table>
                            </div>
    
                            <div class="box box-right">
                                <div class="header"></div>
                                <div class="title"></div>
                                <div class="data">
    
                                </div>
                                <div class="buttons">
                                    <div class="btn" id="btn" data-option="get_closest_players">
                                        <p></p>
                                    </div>
                                </div>
                                <i class="fa-solid fa-user"></i>
                            </div>
                        </div>
                    </div>
                    <div data-type="memberships">
                        <div>
                            <div class="side-boxes">
                                <div data-type="list">
                                    <div class="header"></div>
                                    <div class="title"></div>
                                    <div class="memberships-list">
                                    
                                    </div>
                                    <i class="fa-solid fa-id-card-clip"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div data-type="proteins">
                        <div>
                            <div class="side-boxes">
                                <div data-type="list">
                                    <div class="header"></div>
                                    <div class="title"></div>
                                    <div class="proteins-list">
                                    
                                    </div>
                                    <i class="fa-solid fa-prescription-bottle"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div data-type="boss-management">
                        <div>
                            <div class="header-buttons">
                                <div class="box box-left" data-type="balance">
                                    <div class="header"></div>
                                    <div class="title"></div>
                                    <div class="buttons">
                                        <input data-input="withdraw" type="number" oninput="onInputBalance('withdraw')">
                                        <input data-input="deposit" type="number" oninput="onInputBalance('deposit')">
                                        <div class="btn" id="btn" data-option="withdraw">
                                            <p></p>
                                        </div>
                                        <div class="btn" id="btn" data-option="deposit">
                                            <p></p>
                                        </div>
                                        <div class="close-balance" onclick="balanceButton()">
                                            <i class="fas fa-close"></i>
                                        </div>
                                    </div>
                                    <i class="fa-solid fa-dollar"></i>
                                </div>
                                <div class="box box-right" data-type="employees-count">
                                    <div class="header"></div>
                                    <div class="title"></div>
                                    <div class="buttons">
                                        <div class="btn" id="btn" data-option="employees">
                                            <p></p>
                                        </div>
                                    </div>
                                    <i class="fa-solid fa-user"></i>
                                </div>
                            </div>
                            <div class="box box-right-center" data-type="send-announcement">
                                <div class="header"></div>
                                <div class="title"></div>
                                <textarea data-type="announcement" maxlength="500"></textarea>
                                <div class="buttons">
                                    <div class="btn" id="btn" data-option="send-announce">
                                        <p></p>
                                    </div>
                                </div>
                                <i class="fa-solid fa-bullhorn"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="purchase-menu">
            <div>
                <div class="header">
                    <div class="memberships">

                    </div>
                    <div class="proteins">
                        
                    </div>
                    <div class="close">
                        <i class="fas fa-close"></i>
                    </div>
                </div>
                <div class="memberships-menu"></div>
                <div class="proteins-menu"></div>
            </div>
        </div>

        <div class="statistics-menu">
            <div class="header">
                <span></span>
                <div class="close">
                    <i class="fa-solid fa-xmark"></i>
                </div>
            </div>
            <div class="stats">
                <div id="strenght">
                    <div class="stat-flex stat-title">
                        <i class="fa-solid fa-dumbbell"></i>
                        <p class="stat-name"></p>
                        <p class="stat-percent">0.0%</p>
                    </div>
                    <div class="stat-flex">
                        <div class="stat-bar">
                            <div class="stat-bar-value"></div>
                        </div>
                    </div>
                </div>
                <div id="condition">
                    <hr>
                    <div class="stat-flex stat-title">
                        <i class="fa-solid fa-lungs"></i>
                        <p class="stat-name"></p>
                        <p class="stat-percent">0.0%</p>
                    </div>
                    <div class="stat-flex">
                        <div class="stat-bar">
                            <div class="stat-bar-value"></div>
                        </div>
                    </div>
                </div>
                <div id="shooting">
                    <hr>
                    <div class="stat-flex stat-title">
                        <i class="fa-solid fa-gun"></i>
                        <p class="stat-name"></p>
                        <p class="stat-percent">0.0%</p>
                    </div>
                    <div class="stat-flex">
                        <div class="stat-bar">
                            <div class="stat-bar-value"></div>
                        </div>
                    </div>
                </div>
                <div id="driving">
                    <hr>
                    <div class="stat-flex stat-title">
                        <i class="fa-solid fa-car"></i>
                        <p class="stat-name"></p>
                        <p class="stat-percent">0.0%</p>
                    </div>
                    <div class="stat-flex">
                        <div class="stat-bar">
                            <div class="stat-bar-value"></div>
                        </div>
                    </div>
                </div>
                <div id="flying">
                    <hr>
                    <div class="stat-flex stat-title">
                        <i class="fa-solid fa-plane-up"></i>
                        <p class="stat-name"></p>
                        <p class="stat-percent">0.0%</p>
                    </div>
                    <div class="stat-flex">
                        <div class="stat-bar">
                            <div class="stat-bar-value"></div>
                        </div>
                    </div>
                </div>
                <br>
                <br>
                <div id="notification-status">
                    <p class="status-name"></p>
                    <div class="status-button enabled-status-name" data-value=0></div>
                    <div class="status-button disabled-status-name" data-value=1></div>
                </div>
            </div>
        </div>
        
        <div class="helpInfo">
            <span>
                <div class="stamina-text"></div>
                <div class="stamina-bar">
                    <div class="stamina-value"></div>
                </div>
            </span>
        </div>
        
        <div class="helpButtons">
            <span><img src="buttons/space.png"><span class="key-space"></span></span>
            <span><img src="buttons/f.png"><span class="key-x"></span></span>
        </div>
        
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

        <script src="js/script.js" type="text/javascript"></script>
		<script src="js/loads.js" type="text/javascript"></script>
        <script src="nui://vms_cityhall/html/js/shared.js" type="text/javascript"></script>
    </body>
</html>
